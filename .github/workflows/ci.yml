name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            openssh-server \
            build-essential

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Test key revocation and timed hardening rollback against OpenSSH
        working-directory: src-tauri
        timeout-minutes: 15
        run: |
          fixture="$(mktemp -d)"
          export TERMINALOX_TEST_KEY="$fixture/client"
          export TERMINALOX_TEST_PASSWORD="$(openssl rand -hex 24)"
          ssh-keygen -q -t ed25519 -N '' -f "$TERMINALOX_TEST_KEY"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture/host"
          sudo useradd --create-home --shell /bin/bash terminalox-test
          printf 'terminalox-test:%s\n' "$TERMINALOX_TEST_PASSWORD" | sudo chpasswd
          sudo install -d -m 700 -o terminalox-test /home/terminalox-test/.ssh
          sudo install -m 600 -o terminalox-test "$TERMINALOX_TEST_KEY.pub" /home/terminalox-test/.ssh/authorized_keys
          sudo install -d -m 755 /run/sshd
          cat > "$fixture/sshd_config" <<EOF
          ListenAddress 127.0.0.1
          Port 22222
          HostKey $fixture/host
          PidFile $fixture/sshd.pid
          AllowUsers terminalox-test
          PasswordAuthentication yes
          PubkeyAuthentication yes
          KbdInteractiveAuthentication no
          AuthorizedKeysFile .ssh/authorized_keys
          EOF
          sudo /usr/sbin/sshd -f "$fixture/sshd_config" -E "$fixture/sshd.log"
          mkdir -p "$HOME/.ssh"
          printf '[127.0.0.1]:22222 %s\n' "$(cat "$fixture/host.pub")" >> "$HOME/.ssh/known_hosts"
          cargo test --lib revocation_requires_a_working_password_login -- --ignored

          sudo kill "$(sudo cat "$fixture/sshd.pid")"
          sudo install -m 600 -o terminalox-test "$TERMINALOX_TEST_KEY.pub" /home/terminalox-test/.ssh/authorized_keys
          echo 'terminalox-test ALL=(root) /bin/bash' | sudo tee /etc/sudoers.d/terminalox-test >/dev/null
          sudo chmod 0440 /etc/sudoers.d/terminalox-test
          sudo visudo -cf /etc/sudoers.d/terminalox-test
          sudo install -m 0644 "$fixture/sshd_config" /etc/ssh/sshd_config
          sudo install -d -m 0755 /etc/ssh/sshd_config.d
          printf '%s\n' '# Previous terminalox drop-in' 'PasswordAuthentication yes' |
            sudo tee /etc/ssh/sshd_config.d/00-terminalox.conf >/dev/null
          if systemctl is-active --quiet ssh.socket; then sudo systemctl stop ssh.socket; fi
          sudo systemctl restart ssh.service
          if ! cargo test --lib hardening_restores_config_without_confirmation_and_commits_after_reconnect -- --ignored; then
            sudo journalctl -u ssh.service -u 'terminalox-rollback-*.service' --no-pager -n 100
            exit 1
          fi

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
